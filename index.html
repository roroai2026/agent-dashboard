<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Dashboard</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #0a0a12;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 32px 20px 64px;
    }

    .container { max-width: 960px; margin: 0 auto; }

    header {
      text-align: center;
      margin-bottom: 48px;
    }
    header h1 {
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(90deg, #a78bfa, #60a5fa, #34d399);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #64748b;
      font-size: 0.9rem;
    }
    .updated {
      display: inline-block;
      margin-top: 8px;
      font-size: 0.78rem;
      color: #475569;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 4px 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 28px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.3);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
    }
    .emoji-badge {
      font-size: 2rem;
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.06);
      border-radius: 14px;
    }
    .agent-name { font-size: 1.25rem; font-weight: 700; }
    .agent-role { font-size: 0.8rem; color: #64748b; margin-top: 2px; }

    .status-badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .status-active    { background: rgba(52,211,153,0.15); color: #34d399; }
    .status-configured { background: rgba(96,165,250,0.15); color: #60a5fa; }
    .status-pending   { background: rgba(100,116,139,0.15); color: #64748b; }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat {
      background: rgba(255,255,255,0.03);
      border-radius: 12px;
      padding: 12px 14px;
    }
    .stat-label { font-size: 0.7rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
    .stat-value { font-size: 1.1rem; font-weight: 700; }

    .stat-value.green { color: #34d399; }
    .stat-value.blue  { color: #60a5fa; }
    .stat-value.gold  { color: #fbbf24; }
    .stat-value.purple { color: #a78bfa; }

    .divider { border: none; border-top: 1px solid rgba(255,255,255,0.06); margin: 16px 0; }

    .meta-row { display: flex; justify-content: space-between; font-size: 0.78rem; color: #64748b; margin-bottom: 6px; }
    .meta-row span:last-child { color: #94a3b8; }

    .topics-label { font-size: 0.72rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; margin-top: 16px; }
    .topics { display: flex; flex-wrap: wrap; gap: 6px; }
    .topic-chip {
      font-size: 0.72rem;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 3px 10px;
      color: #94a3b8;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .totals {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 16px;
      padding: 24px 28px;
      display: flex;
      flex-wrap: wrap;
      gap: 32px;
      justify-content: space-around;
      text-align: center;
    }
    .total-item {}
    .total-value { font-size: 1.8rem; font-weight: 800; }
    .total-label { font-size: 0.78rem; color: #64748b; margin-top: 4px; }

    .error {
      text-align: center;
      padding: 60px 20px;
      color: #ef4444;
      font-size: 0.9rem;
    }

    footer {
      text-align: center;
      margin-top: 48px;
      font-size: 0.75rem;
      color: #334155;
    }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>🧠 Agent Dashboard</h1>
    <p class="subtitle">OpenClaw — Agent Activity & Usage</p>
    <div class="updated" id="updated-at">Loading...</div>
  </header>

  <div class="grid" id="agent-grid"></div>
  <div class="totals" id="totals"></div>

  <footer>Updates every 12 hours · Powered by OpenClaw</footer>
</div>

<script>
  function fmt(n) {
    if (n >= 1000000) return (n/1000000).toFixed(1) + 'M';
    if (n >= 1000) return (n/1000).toFixed(1) + 'k';
    return n.toString();
  }

  function fmtDate(iso) {
    if (!iso) return 'Never';
    const d = new Date(iso);
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function fmtRelative(iso) {
    if (!iso) return 'Never';
    const d = new Date(iso);
    const diff = Date.now() - d.getTime();
    const mins = Math.floor(diff / 60000);
    if (mins < 60) return `${mins}m ago`;
    const hours = Math.floor(mins / 60);
    if (hours < 24) return `${hours}h ago`;
    const days = Math.floor(hours / 24);
    return `${days}d ago`;
  }

  function renderAgent(a) {
    const statusClass = `status-${a.status || 'pending'}`;
    const topics = (a.recentTopics || []).slice(0, 4);

    return `
      <div class="card">
        <div class="card-header">
          <div class="emoji-badge">${a.emoji || '🤖'}</div>
          <div>
            <div class="agent-name">${a.name}</div>
            <div class="agent-role">${a.role}</div>
          </div>
        </div>
        <span class="status-badge ${statusClass}">${a.status || 'pending'}</span>

        <div class="stats" style="margin-top:16px;">
          <div class="stat">
            <div class="stat-label">Sessions</div>
            <div class="stat-value blue">${fmt(a.totalSessions || 0)}</div>
          </div>
          <div class="stat">
            <div class="stat-label">Messages</div>
            <div class="stat-value purple">${fmt(a.totalMessages || 0)}</div>
          </div>
          <div class="stat">
            <div class="stat-label">Tokens In</div>
            <div class="stat-value green">${fmt(a.totalTokensIn || 0)}</div>
          </div>
          <div class="stat">
            <div class="stat-label">Tokens Out</div>
            <div class="stat-value gold">${fmt(a.totalTokensOut || 0)}</div>
          </div>
        </div>

        <hr class="divider" />

        <div class="meta-row"><span>Created</span><span>${fmtDate(a.created)}</span></div>
        <div class="meta-row"><span>Last Active</span><span>${fmtRelative(a.lastActive)}</span></div>
        <div class="meta-row"><span>Est. Cost</span><span>$${(a.estimatedCostUsd || 0).toFixed(4)}</span></div>

        ${topics.length ? `
        <div class="topics-label">Recent Activity</div>
        <div class="topics">
          ${topics.map(t => `<span class="topic-chip" title="${t}">${t}</span>`).join('')}
        </div>` : ''}
      </div>
    `;
  }

  async function load() {
    try {
      const res = await fetch('./dashboard-data.json?t=' + Date.now());
      if (!res.ok) throw new Error('Failed to load data');
      const data = await res.json();

      document.getElementById('updated-at').textContent =
        'Last updated: ' + new Date(data.generatedAt).toLocaleString();

      document.getElementById('agent-grid').innerHTML =
        (data.agents || []).map(renderAgent).join('');

      const totals = (data.agents || []).reduce((acc, a) => {
        acc.sessions += a.totalSessions || 0;
        acc.messages += a.totalMessages || 0;
        acc.tokensIn += a.totalTokensIn || 0;
        acc.tokensOut += a.totalTokensOut || 0;
        acc.cost += a.estimatedCostUsd || 0;
        return acc;
      }, { sessions: 0, messages: 0, tokensIn: 0, tokensOut: 0, cost: 0 });

      document.getElementById('totals').innerHTML = `
        <div class="total-item">
          <div class="total-value" style="color:#60a5fa">${totals.sessions}</div>
          <div class="total-label">Total Sessions</div>
        </div>
        <div class="total-item">
          <div class="total-value" style="color:#a78bfa">${fmt(totals.messages)}</div>
          <div class="total-label">Total Messages</div>
        </div>
        <div class="total-item">
          <div class="total-value" style="color:#34d399">${fmt(totals.tokensIn + totals.tokensOut)}</div>
          <div class="total-label">Total Tokens</div>
        </div>
        <div class="total-item">
          <div class="total-value" style="color:#fbbf24">$${totals.cost.toFixed(3)}</div>
          <div class="total-label">Total Cost</div>
        </div>
      `;
    } catch (e) {
      document.getElementById('agent-grid').innerHTML =
        `<div class="error">⚠️ Could not load dashboard data.<br/>${e.message}</div>`;
    }
  }

  load();
</script>
</body>
</html>
